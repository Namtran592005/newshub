services:
  php:
    image: php:8.2-cli-alpine
    container_name: newshub-php
    volumes:
      - .:/app
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: newshub-ofelia
    depends_on:
      - php
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.fetch-news.schedule: "@every 1m"
      ofelia.job-run.fetch-news.command: "php /app/cron.php"
      ofelia.job-run.fetch-news.container: "newshub-php"
    restart: unless-stopped
