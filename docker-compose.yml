services:
  php:
    image: php:8.2-cli-alpine
    container_name: newshub-php
    volumes:
      - .:/app
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[$$(date '+%Y-%m-%d %H:%M:%S')] Running cron..."
          php /app/cron.php
          sleep 60
        done
    restart: unless-stopped
